name: Custom Sing-box Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows]
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get Version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || git describe --tags --abbrev=0 --match="1.*" 2>/dev/null || echo "v-custom")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Build Sing-box
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p output
          FILENAME="sing-box"
          if [ "${{ matrix.os }}" = "windows" ]; then
            FILENAME="sing-box.exe"
          fi
          go build -v -trimpath -ldflags "-s -w -buildid= -checklinkname=0" -tags "with_quic,with_grpc,with_dhcp,with_utls,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0" -o output/$FILENAME ./cmd/sing-box

      - name: Fetch libcronet
        shell: bash
        run: |
          CRONET_VERSION=$(cat .github/CRONET_GO_VERSION 2>/dev/null || echo "HEAD")
          git clone --filter=blob:none --no-checkout https://github.com/sagernet/cronet-go.git cronet_temp
          cd cronet_temp
          git checkout "$CRONET_VERSION" -- lib/${{ matrix.os }}_${{ matrix.arch }} 2>/dev/null || true
          if [ -d "lib/${{ matrix.os }}_${{ matrix.arch }}" ]; then
            cp lib/${{ matrix.os }}_${{ matrix.arch }}/*.so ../output/ 2>/dev/null || true
            cp lib/${{ matrix.os }}_${{ matrix.arch }}/*.dll ../output/ 2>/dev/null || true
          fi

      - name: Create Archive
        shell: bash
        run: |
          mkdir -p release_assets
          cd output
          ARCHIVE_NAME="sing-box-${{ env.APP_VERSION }}-custom-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -j "../release_assets/${ARCHIVE_NAME}.zip" sing-box.exe *.dll 2>/dev/null || zip -j "../release_assets/${ARCHIVE_NAME}.zip" sing-box.exe
          else
            tar -czvf "../release_assets/${ARCHIVE_NAME}.tar.gz" sing-box *.so 2>/dev/null || tar -czvf "../release_assets/${ARCHIVE_NAME}.tar.gz" sing-box
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          tag_name: "${{ env.APP_VERSION }}-custom-${{ github.run_number }}"
          name: "${{ env.APP_VERSION }} Build #${{ github.run_number }} (FallbackSite)"
          body: |
            Build with FallbackSite for NaiveProxy.
            Based on: **${{ env.APP_VERSION }}**
            - Includes executable and libcronet (if available).
            - Built with `with_purego`.